metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "lmdb"

replication_factor = 1

rpc_bind_addr = "0.0.0.0:3902"
rpc_public_addr = "127.0.0.1:3902"
# RPC secret is supplied privately through GARAGE_RPC_SECRET.

[s3_api]
s3_region    = "garage"
api_bind_addr = "0.0.0.0:3900"
root_domain  = ".s3.garage.localhost"

[s3_web]
# A porta 3902 pertence ao RPC; o servidor web precisa de outra porta.
bind_addr = "0.0.0.0:3903"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "0.0.0.0:3901"

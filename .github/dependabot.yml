version: 2
updates:
  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    cooldown:
      default-days: 7
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    cooldown:
      default-days: 7
    directories: [/backend, /frontend]
    schedule:
      interval: weekly

name: Continuous Integration (CI)

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  # --------------------------------------------------------------------
  # 1) BACKEND CI ------------------------------------------------------
  # --------------------------------------------------------------------
  backend-ci:
    name: Backend Lint, Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Backend
        run: dotnet build --no-restore --configuration Release

      - name: Run Tests with Coverage
        run: |
          dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --settings ./coverlet.runsettings

  # --------------------------------------------------------------------
  # 2) FRONTEND CI -----------------------------------------------------
  # --------------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint, Build & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build

      - name: Security Audit (Fail on Critical)
        run: npm audit --audit-level=critical || echo "Aviso: Falha na comunicacao com o registry npmjs ou vulnerabilidade detectada. A auditoria completa de dependencias e conduzida pelo Trivy."

  # --------------------------------------------------------------------
  # 3) SECURITY (SAST - SEMGREP) ---------------------------------------
  # --------------------------------------------------------------------
  security-sast:
    name: Security SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep Security Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/csharp
            p/javascript
            p/typescript
        env:
          SEMGREP_RULES: >-
            p/security-audit
            p/owasp-top-ten

  # --------------------------------------------------------------------
  # 4) SECURITY (SCA - TRIVY FS SCAN) ----------------------------------
  # --------------------------------------------------------------------
  security-trivy:
    name: Security SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy vulnerability scanner on repo
        run: |
          trivy fs --severity CRITICAL,HIGH --exit-code 0 .

  # --------------------------------------------------------------------
  # 5) SECURITY (DAST - OWASP ZAP) -------------------------------------
  # --------------------------------------------------------------------
  security-dast:
    name: Security DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        continue-on-error: true
        with:
          target: 'https://gradusflow.site'
          issue_title: 'DAST: Alerta de seguranca detectado pelo OWASP ZAP'
          fail_action: false

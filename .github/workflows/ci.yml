name: Continuous Integration (CI)

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  # --------------------------------------------------------------------
  # 1) BACKEND CI ------------------------------------------------------
  # --------------------------------------------------------------------
  backend-ci:
    name: Backend Lint, Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Backend
        run: dotnet build --no-restore --configuration Release

      - name: Run Tests with Coverage
        run: |
          dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --settings ./coverlet.runsettings

  # --------------------------------------------------------------------
  # 2) FRONTEND CI -----------------------------------------------------
  # --------------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint, Build & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build

      - name: Security Audit (Fail on Critical)
        run: npm audit --audit-level=critical

  # --------------------------------------------------------------------
  # 3) SECURITY (SAST - SEMGREP) ---------------------------------------
  # --------------------------------------------------------------------
  security-sast:
    name: Security SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep Security Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/csharp
            p/javascript
            p/typescript
        env:
          SEMGREP_RULES: >-
            p/security-audit
            p/owasp-top-ten

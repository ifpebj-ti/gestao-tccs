name: Production CI/CD & Release Workflow

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
      - "docker-compose-prod.yml"

  workflow_dispatch:
    inputs:
      deploy:
        description: 'Executar deploy após a release (somente após provisionar a OCI)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  quality:
    name: Validate release commit
    uses: ./.github/workflows/ci.yml
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch')
  # --------------------------------------------------------------------
  # 0) TAG CREATION ----------------------------------------------------
  # --------------------------------------------------------------------
  tag-creation:
    needs: quality
    name: 0. Automatic Creation Process of New Tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    outputs:
      created_tag: ${{ steps.created_tag.outputs.created_tag }}
      change_type: ${{ steps.change_type.outputs.change_type }}
      should_release: ${{ steps.created_tag.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Extract type of change from PR
        id: change_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "change_type=nova-feature-refactor" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > body.txt

          change_type=""
          if grep -q "\[x\] novo-marco" body.txt; then
            change_type="novo-marco"
          elif grep -q "\[x\] nova-feature-refactor" body.txt; then
            change_type="nova-feature-refactor"
          elif grep -q "\[x\] bug-fix" body.txt; then
            change_type="bug-fix"
          elif grep -q "\[x\] outros" body.txt; then
            change_type="outros"
          else
            echo "No option scheduled correctly in 'change_type:'"
            exit 1
          fi

          echo "change_type=$change_type" >> "$GITHUB_OUTPUT"

      - name: Get the last release tag
        id: last_tag
        run: |
          gh auth setup-git
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [[ -z "$tag" ]]; then tag="0.0.0"; fi
          echo "last_tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate new tag
        id: created_tag
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.last_tag.outputs.last_tag }}"
          case "${{ steps.change_type.outputs.change_type }}" in
            bug-fix)
              patch=$((patch + 1))
              ;;
            nova-feature-refactor)
              minor=$((minor + 1))
              patch=0
              ;;
            novo-marco)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            outros)
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "No release for outros; published versions remain intact."
              exit 0
              ;;
          esac
          created_tag="${major}.${minor}.${patch}"
          echo "New tag: $created_tag"
          echo "created_tag=$created_tag" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Refuse existing Git and image version tags before building
        if: steps.created_tag.outputs.should_release == 'true'
        env:
          CREATED_TAG: ${{ steps.created_tag.outputs.created_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/controlled-publication.cjs release-preflight "$CREATED_TAG"

  # --------------------------------------------------------------------
  # 1) BACKEND DOCKER --------------------------------------------------
  # --------------------------------------------------------------------
  backend-docker:
    name: 1. Backend CI/CD & Image Build
    outputs:
      coverage_percentage: ${{ steps.test-coverage.outputs.coverage_percentage }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: tag-creation
    if: needs.tag-creation.outputs.should_release == 'true'
    env:
      CREATED_TAG: ${{ needs.tag-creation.outputs.created_tag }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Tests and Code Coverage
        id: test-coverage
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils

          dotnet test --collect:"XPlat Code Coverage" --settings ./coverlet.runsettings --results-directory ./coverage/

          COVERAGE_FILE=$(find ./coverage -name coverage.opencover.xml -print -quit)

          if [ -z "$COVERAGE_FILE" ]; then
            echo "❌ Arquivo coverage.opencover.xml não encontrado!"
            exit 1
          fi

          echo "Arquivo de cobertura encontrado em: $COVERAGE_FILE"

          RAW_COVERAGE=$(xmllint --xpath 'string(/CoverageSession/Summary/@sequenceCoverage)' "$COVERAGE_FILE")
          COVERAGE_PERCENTAGE=$(echo "$RAW_COVERAGE" | cut -d. -f1)
          echo "Porcentagem final para o badge: $COVERAGE_PERCENTAGE"

          echo "report_path=$COVERAGE_FILE" >> "$GITHUB_OUTPUT"
          echo "coverage_percentage=${COVERAGE_PERCENTAGE:-0}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: scripts/buildkit-validation.toml

      - name: Build and smoke both backend platforms before publication
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gestaotccs-backend
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$IMAGE:$CREATED_TAG-$arch" --file Dockerfile.multiarch .
            bash ../scripts/multiarch-smoke.sh backend "linux/$arch" "$IMAGE:$CREATED_TAG-$arch"
          done

      - name: Install Trivy
        run: |
          bash ../scripts/install-security-tools.sh

      - name: Scan Backend Image for Critical Vulnerabilities (Trivy)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gestaotccs-backend
        run: |
          for arch in amd64 arm64; do
            trivy image --format json --output "$RUNNER_TEMP/backend-$arch.json" "$IMAGE:$CREATED_TAG-$arch"
            node ../scripts/security-gate.cjs trivy "$RUNNER_TEMP/backend-$arch.json"
          done

      - name: Retain backend image vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-backend-image-scans
          path: ${{ runner.temp }}/backend-*.json
          retention-days: 14

      - name: Publish only staged images; promotion waits for both services
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gestaotccs-backend
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stagingTag=$(node ../scripts/controlled-publication.cjs candidate-tag)
          for arch in amd64 arm64; do
            node ../scripts/controlled-publication.cjs absent "$IMAGE" "$stagingTag-$arch"
            docker tag "$IMAGE:$CREATED_TAG-$arch" "$IMAGE:$stagingTag-$arch"
            docker push "$IMAGE:$stagingTag-$arch"
            node ../scripts/controlled-publication.cjs verify "$IMAGE" "$stagingTag-$arch" "$arch"
          done

  # --------------------------------------------------------------------
  # 2) FRONTEND DOCKER -------------------------------------------------
  # --------------------------------------------------------------------
  frontend-docker:
    name: 2. Frontend CI/CD & Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: tag-creation
    if: needs.tag-creation.outputs.should_release == 'true'
    env:
      CREATED_TAG: ${{ needs.tag-creation.outputs.created_tag }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: scripts/buildkit-validation.toml

      - name: Build and smoke both frontend platforms before publication
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gestaotccs-frontend
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --build-arg "NEXT_PUBLIC_APP_VERSION=$CREATED_TAG" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$IMAGE:$CREATED_TAG-$arch" --file Dockerfile.multiarch .
            bash ../scripts/multiarch-smoke.sh frontend "linux/$arch" "$IMAGE:$CREATED_TAG-$arch"
          done

      - name: Install Trivy
        run: |
          bash ../scripts/install-security-tools.sh

      - name: Scan Frontend Image for Critical Vulnerabilities (Trivy)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gestaotccs-frontend
        run: |
          for arch in amd64 arm64; do
            trivy image --format json --output "$RUNNER_TEMP/frontend-$arch.json" "$IMAGE:$CREATED_TAG-$arch"
            node ../scripts/security-gate.cjs trivy "$RUNNER_TEMP/frontend-$arch.json"
          done

      - name: Retain frontend image vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-frontend-image-scans
          path: ${{ runner.temp }}/frontend-*.json
          retention-days: 14

      - name: Publish only staged images; promotion waits for both services
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gestaotccs-frontend
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stagingTag=$(node ../scripts/controlled-publication.cjs candidate-tag)
          for arch in amd64 arm64; do
            node ../scripts/controlled-publication.cjs absent "$IMAGE" "$stagingTag-$arch"
            docker tag "$IMAGE:$CREATED_TAG-$arch" "$IMAGE:$stagingTag-$arch"
            docker push "$IMAGE:$stagingTag-$arch"
            node ../scripts/controlled-publication.cjs verify "$IMAGE" "$stagingTag-$arch" "$arch"
          done

  # --------------------------------------------------------------------
  # 3) RELEASE CREATION ------------------------------------------------
  # --------------------------------------------------------------------
  release-creation:
    timeout-minutes: 15
    name: 3. Automatic Creation Process of New Releases
    runs-on: ubuntu-latest
    needs: [tag-creation, backend-docker, frontend-docker]
    if: needs.tag-creation.outputs.should_release == 'true'
    permissions:
      contents: write
      packages: write
    env:
      CREATED_TAG: ${{ needs.tag-creation.outputs.created_tag }}
      CHANGE_TYPE: ${{ needs.tag-creation.outputs.change_type }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify both staged services and publish new version indexes
        run: node scripts/controlled-publication.cjs assemble-release "$CREATED_TAG"

      - name: Release Publication
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CREATED_TAG }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.CREATED_TAG }}
          generate_release_notes: true
          body: |
            Release automatically generated from the request #${{ github.event.pull_request.number }}
            Type of change: ${{ env.CHANGE_TYPE }}
            
            Images published:
            - ghcr.io/${{ github.repository_owner }}/gestaotccs-backend:${{ env.CREATED_TAG }}
            - ghcr.io/${{ github.repository_owner }}/gestaotccs-frontend:${{ env.CREATED_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the Git release tag points to the compiled commit
        run: node scripts/controlled-publication.cjs verify-release-source "$CREATED_TAG"

      - name: Verify both versions before promoting latest
        run: node scripts/controlled-publication.cjs promote-release "$CREATED_TAG"

      - name: Upload Code Coverage Badge from the current README snapshot
        continue-on-error: true
        env:
          COVERAGE_PERCENTAGE: ${{ needs.backend-docker.outputs.coverage_percentage }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/README.md" > "$RUNNER_TEMP/readme.json"
          node scripts/controlled-publication.cjs badge-content "$RUNNER_TEMP/readme.json" "$COVERAGE_PERCENTAGE" > "$RUNNER_TEMP/badge-update.json"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/README.md" --input "$RUNNER_TEMP/badge-update.json"

  deploy:
    name: Manual production deployment
    needs: [tag-creation, release-creation]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.deploy &&
      github.ref == 'refs/heads/main' && needs.tag-creation.outputs.should_release == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check deployment configuration before either webhook
        env:
          BACKEND: ${{ secrets.PORTAINER_WEBHOOK_BACKEND }}
          FRONTEND: ${{ secrets.PORTAINER_WEBHOOK_FRONTEND }}
        run: |
          test -n "$BACKEND" && test -n "$FRONTEND"
          case "$BACKEND" in https://*) ;; *) exit 1 ;; esac
          case "$FRONTEND" in https://*) ;; *) exit 1 ;; esac
      - name: Trigger Portainer webhook to update Backend service
        env:
          PORTAINER_WEBHOOK_BACKEND: ${{ secrets.PORTAINER_WEBHOOK_BACKEND }}
        run: curl --fail --silent --show-error --proto '=https' --connect-timeout 15 --max-time 60 -X POST "$PORTAINER_WEBHOOK_BACKEND"

      - name: Trigger Portainer webhook to update Frontend service
        env:
          PORTAINER_WEBHOOK_FRONTEND: ${{ secrets.PORTAINER_WEBHOOK_FRONTEND }}
        run: curl --fail --silent --show-error --proto '=https' --connect-timeout 15 --max-time 60 -X POST "$PORTAINER_WEBHOOK_FRONTEND"

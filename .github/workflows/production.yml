name: Production CI/CD & Release Workflow

on:
  push:
    branches: [main]
    paths: [.release-please-manifest.json]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Implantar a release publicada mais recente'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  quality:
    name: Validate release commit
    uses: ./.github/workflows/ci.yml
    needs: tag-creation
    if: needs.tag-creation.outputs.should_release == 'true'

  tag-creation:
    name: Detect a merged release
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      created_tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Detect a new version at the release merge
        id: version
        run: |
          tag=$(jq -er '."."' .release-please-manifest.json)
          [[ "$tag" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          if git show HEAD^:.release-please-manifest.json >/dev/null 2>&1; then
            previous=$(git show HEAD^:.release-please-manifest.json | jq -er '."."')
          else
            previous="$tag"
          fi
          if [[ "$tag" == "$previous" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - name: Refuse existing version tags before building
        if: steps.version.outputs.should_release == 'true'
        env:
          CREATED_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$RELEASE_PLEASE_TOKEN" || { echo "::error::Configure RELEASE_PLEASE_TOKEN"; exit 1; }
          node scripts/controlled-publication.cjs release-preflight "$CREATED_TAG"

  # 1) BACKEND DOCKER --------------------------------------------------
  # --------------------------------------------------------------------
  backend-docker:
    name: 1. Backend CI/CD & Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [tag-creation, quality]
    if: needs.tag-creation.outputs.should_release == 'true'
    env:
      CREATED_TAG: ${{ needs.tag-creation.outputs.created_tag }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-config: scripts/buildkit-validation.toml

      - name: Build and smoke both backend platforms before publication
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gestaotccs-backend
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$IMAGE:$CREATED_TAG-$arch" --file Dockerfile.multiarch .
            bash ../scripts/multiarch-smoke.sh backend "linux/$arch" "$IMAGE:$CREATED_TAG-$arch"
          done

      - name: Install Trivy
        run: |
          bash ../scripts/install-security-tools.sh

      - name: Scan Backend Image for Critical Vulnerabilities (Trivy)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gestaotccs-backend
        run: |
          for arch in amd64 arm64; do
            trivy image --format json --output "$RUNNER_TEMP/backend-$arch.json" "$IMAGE:$CREATED_TAG-$arch"
            node ../scripts/security-gate.cjs trivy "$RUNNER_TEMP/backend-$arch.json"
          done

      - name: Retain backend image vulnerability reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-backend-image-scans
          path: ${{ runner.temp }}/backend-*.json
          retention-days: 14

      - name: Publish only staged images; promotion waits for both services
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gestaotccs-backend
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stagingTag=$(node ../scripts/controlled-publication.cjs candidate-tag)
          for arch in amd64 arm64; do
            node ../scripts/controlled-publication.cjs absent "$IMAGE" "$stagingTag-$arch"
            docker tag "$IMAGE:$CREATED_TAG-$arch" "$IMAGE:$stagingTag-$arch"
            docker push "$IMAGE:$stagingTag-$arch"
            node ../scripts/controlled-publication.cjs verify "$IMAGE" "$stagingTag-$arch" "$arch"
          done

  # --------------------------------------------------------------------
  # 2) FRONTEND DOCKER -------------------------------------------------
  # --------------------------------------------------------------------
  frontend-docker:
    name: 2. Frontend CI/CD & Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [tag-creation, quality]
    if: needs.tag-creation.outputs.should_release == 'true'
    env:
      CREATED_TAG: ${{ needs.tag-creation.outputs.created_tag }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-config: scripts/buildkit-validation.toml

      - name: Build and smoke both frontend platforms before publication
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gestaotccs-frontend
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --build-arg "NEXT_PUBLIC_APP_VERSION=$CREATED_TAG" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$IMAGE:$CREATED_TAG-$arch" --file Dockerfile.multiarch .
            bash ../scripts/multiarch-smoke.sh frontend "linux/$arch" "$IMAGE:$CREATED_TAG-$arch"
          done

      - name: Install Trivy
        run: |
          bash ../scripts/install-security-tools.sh

      - name: Scan Frontend Image for Critical Vulnerabilities (Trivy)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gestaotccs-frontend
        run: |
          for arch in amd64 arm64; do
            trivy image --format json --output "$RUNNER_TEMP/frontend-$arch.json" "$IMAGE:$CREATED_TAG-$arch"
            node ../scripts/security-gate.cjs trivy "$RUNNER_TEMP/frontend-$arch.json"
          done

      - name: Retain frontend image vulnerability reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-frontend-image-scans
          path: ${{ runner.temp }}/frontend-*.json
          retention-days: 14

      - name: Publish only staged images; promotion waits for both services
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gestaotccs-frontend
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stagingTag=$(node ../scripts/controlled-publication.cjs candidate-tag)
          for arch in amd64 arm64; do
            node ../scripts/controlled-publication.cjs absent "$IMAGE" "$stagingTag-$arch"
            docker tag "$IMAGE:$CREATED_TAG-$arch" "$IMAGE:$stagingTag-$arch"
            docker push "$IMAGE:$stagingTag-$arch"
            node ../scripts/controlled-publication.cjs verify "$IMAGE" "$stagingTag-$arch" "$arch"
          done

  # --------------------------------------------------------------------
  # 3) RELEASE CREATION ------------------------------------------------
  # --------------------------------------------------------------------
  release-creation:
    timeout-minutes: 15
    name: 3. Automatic Creation Process of New Releases
    runs-on: ubuntu-latest
    needs: [quality, tag-creation, backend-docker, frontend-docker]
    if: needs.tag-creation.outputs.should_release == 'true'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      CREATED_TAG: ${{ needs.tag-creation.outputs.created_tag }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify both staged services and publish new version indexes
        run: node scripts/controlled-publication.cjs assemble-release "$CREATED_TAG"

      - name: Publish the GitHub release
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          target-branch: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          skip-github-pull-request: true
      - name: Check the version created by Release Please
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: test "$RELEASE_TAG" = "$CREATED_TAG"
      - name: Confirm the Git release tag points to the compiled commit
        run: node scripts/controlled-publication.cjs verify-release-source "$CREATED_TAG"

      - name: Verify both versions before promoting latest
        run: node scripts/controlled-publication.cjs promote-release "$CREATED_TAG"

      - name: Upload Code Coverage Badge from the current README snapshot
        continue-on-error: true
        env:
          COVERAGE_PERCENTAGE: ${{ needs.quality.outputs.coverage_percentage }}
        run: node scripts/badge-pull-request.cjs

  deploy:
    name: Manual production deployment
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the latest published release and both deployed image references
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          [[ "$tag" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          GITHUB_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          export GITHUB_SHA
          for service in backend frontend; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gestaotccs-$service"
            published=$(node scripts/controlled-publication.cjs verify-published "$image" "$tag")
            latest=$(node scripts/controlled-publication.cjs verify-published "$image" latest)
            test "$(jq -er .digest <<< "$published")" = "$(jq -er .digest <<< "$latest")"
          done
      - name: Check deployment configuration before either webhook
        env:
          BACKEND: ${{ secrets.PORTAINER_WEBHOOK_BACKEND }}
          FRONTEND: ${{ secrets.PORTAINER_WEBHOOK_FRONTEND }}
        run: |
          test -n "$BACKEND" && test -n "$FRONTEND"
          case "$BACKEND" in "https://"*) ;; *) exit 1 ;; esac
          case "$FRONTEND" in "https://"*) ;; *) exit 1 ;; esac
      - name: Trigger Portainer webhook to update Backend service
        env:
          PORTAINER_WEBHOOK_BACKEND: ${{ secrets.PORTAINER_WEBHOOK_BACKEND }}
        run: curl --fail --silent --show-error --proto '=https' --connect-timeout 15 --max-time 60 -X POST "$PORTAINER_WEBHOOK_BACKEND"

      - name: Trigger Portainer webhook to update Frontend service
        env:
          PORTAINER_WEBHOOK_FRONTEND: ${{ secrets.PORTAINER_WEBHOOK_FRONTEND }}
        run: curl --fail --silent --show-error --proto '=https' --connect-timeout 15 --max-time 60 -X POST "$PORTAINER_WEBHOOK_FRONTEND"

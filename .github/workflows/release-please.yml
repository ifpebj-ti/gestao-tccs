name: Release Please
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-please-main
  cancel-in-progress: false
jobs:
  release-pr:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: main
      - name: Check whether the current version has been published
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(jq -er '."."' .release-please-manifest.json)
          published=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [[ "$tag" == "$published" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the release PR
        if: steps.version.outputs.published == 'true'
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          target-branch: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          skip-github-release: true

version: "3.8"

services:
  backend:
    build:
      context: ./backend
    container_name: gestao-backend
    ports:
      - "${PORT_MACHINE_BACKEND}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DEFAULTCONNECTION}
      - JWT_SETTINGS__TOKEN_KEY=${TOKEN_KEY}
      - JWT_SETTINGS__ACCESSTOKEN_EXPIRATION_TIME=${ACCESSTOKEN_EXPIRATION_TIME}
      - MailSettings__Host=${MAILSETTINGS_HOST}
      - MailSettings__Port=${MAILSETTINGS_PORT}
      - MailSettings__Name=${MAILSETTINGS_NAME}
      - MailSettings__EmailId=${MAILSETTINGS_EMAILID}
      - MailSettings__UserName=${MAILSETTINGS_USERNAME}
      - MailSettings__Password=${MAILSETTINGS_PASSWORD}
      - COMBINATION_STRING_FOR_ACCESSCODE=${COMBINATION_STRING_FOR_ACCESSCODE}
      - STORAGE_SETTINGS__ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_SETTINGS__ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - STORAGE_SETTINGS__SECRET_KEY=${STORAGE_SECRET_KEY}
      - STORAGE_SETTINGS__BUCKET_NAME=${STORAGE_BUCKET_NAME}
      - CORS_SETTINGS__URL_FRONT=${CORS_SETTINGS_URL_FRONT}
      - URL_TEMPO=${URL_TEMPO}
      - URL_LOKI=${URL_LOKI}
    restart: unless-stopped
    volumes:
      - ./backend/gestaotcc.WebApi/Templates:/app/Templates
    networks:
      - front_net
      - back_net
      - observability-net
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: gestao-frontend
    ports:
      - "${PORT_MACHINE_FRONTEND}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - front_net
      - management-net

  postgres:
    image: postgres:15
    container_name: gestao-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PORT_MACHINE_POSTGRES}:5432"
    restart: unless-stopped
    networks:
      - back_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  garage:
    image: dxflrs/garage:v1.0.1
    container_name: gestao-garage
    ports:
      - "${PORT_MACHINE_S3_GARAGE:-3900}:3900"   # S3 API
      - "${PORT_MACHINE_ADMIN_GARAGE:-3901}:3901" # Admin API
    volumes:
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
      - ./garage.toml:/etc/garage.toml
    restart: unless-stopped
    networks:
      - back_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - back_net

volumes:
  postgres_data:
  garage_data:
  garage_meta:

networks:
  front_net:
  back_net:
  observability-net:
    external: true
  management-net:
    external: true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8"/>
  </filter>
  <g filter="url(#shadow)">
    <!-- Top diamond -->
    <polygon points="32,7 61,22 32,37 3,22" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" fill="none"/>
    <!-- Skullcap underneath -->
    <path d="M13,28 V42 C13,52 51,52 51,42 V28" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Tassel center line -->
    <line x1="32" y1="22" x2="50" y2="23" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Tassel drop -->
    <line x1="50" y1="23" x2="50" y2="40" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Tassel ring -->
    <circle cx="50" cy="43" r="3" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    <!-- Tassel skirt -->
    <polygon points="50,48 44,61 56,61" fill="#FFFFFF"/>
  </g>
</svg>